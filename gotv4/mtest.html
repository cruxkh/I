<!doctype html><html><head><meta charset="utf-8"><title>mtest</title>
<style>
@font-face{font-family:Rubik;src:url(fonts/Rubik.ttf);font-weight:300 900}
@font-face{font-family:Secular;src:url(fonts/SecularOne.ttf)}
@font-face{font-family:Fredoka;src:url(fonts/Fredoka.ttf);font-weight:300 700}
@font-face{font-family:Bangers;src:url(fonts/Bangers.ttf)}
html,body{margin:0;background:#000}
</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="engine.js"></script><script src="vkit.js"></script><script src="vlogo.js"></script><script src="vmascot.js"></script><script src="vsticker.js"></script>
<script>
window.gReady = Promise.all(['700 40px Rubik','900 40px Rubik','40px Bangers','40px Fredoka','40px Secular'].map(f=>document.fonts.load(f,'אבגabc'))).then(()=>1);
function bg(ctx,W,H,t){ctx.fillStyle='#0B1450';ctx.fillRect(0,0,W,H);const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0A1240');g.addColorStop(1,'#1a2a8a');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);}
// mode 'mascot': grid of poses at time t ; 'stickers': grid of all stickers at time t (t0=0)
window.T={
 mascot(W,H,t,opt){const c=document.getElementById('c');c.width=W;c.height=H;const g=c.getContext('2d');bg(g,W,H,t);
  const P=V.mascotPoses,cols=opt&&opt.cols||4,rows=Math.ceil(P.length/cols),cw=W/cols,ch=H/rows,s=Math.min(cw,ch)/380;
  P.forEach((p,i)=>{const cx=(i%cols+.5)*cw,cy=(Math.floor(i/cols)+.5)*ch;V.mascot(g,cx,cy,s,{t,t0:0,pose:p,look:'cam',glow:.6});g.fillStyle='#ff0';g.font='20px monospace';g.fillText(p,cx-30,cy+ch/2-10)});},
 one(W,H,t,o){const c=document.getElementById('c');c.width=W;c.height=H;const g=c.getContext('2d');bg(g,W,H,t);V.mascot(g,W/2,H/2,o.s||3,Object.assign({t,t0:0,glow:.6},o));},
 stickers(W,H,t,opt){const c=document.getElementById('c');c.width=W;c.height=H;const g=c.getContext('2d');bg(g,W,H,t);
  const N=V.stickerNames,cols=opt&&opt.cols||6,rows=Math.ceil(N.length/cols),cw=W/cols,ch=H/rows,s=Math.min(cw,ch)/330;
  N.forEach((n,i)=>{const cx=(i%cols+.5)*cw,cy=(Math.floor(i/cols)+.5)*ch;V.sticker(g,n,cx,cy,s,{t,t0:0});g.fillStyle='#ff0';g.font='18px monospace';g.fillText(n,cx-cw/2+8,cy+ch/2-8)});},
 strip(W,H,t,o){const c=document.getElementById('c');c.width=W;c.height=H;const g=c.getContext('2d');bg(g,W,H,t);const names=o.names.split(','),ts=o.ts.split(',').map(Number),rows=names.length,cols=ts.length,cw=W/cols,ch=H/rows,s=Math.min(cw,ch)/(o.mascot?400:330);
  names.forEach((n,r)=>ts.forEach((tt,i)=>{const cx=(i+.5)*cw,cy=(r+.5)*ch;const oo={t:tt,t0:0,text:o.text,tOut:o.tOut,pose:n,glow:.5,look:'cam'};if(o.mascot)V.mascot(g,cx,cy,s,oo);else V.sticker(g,n,cx,cy,s,oo);g.fillStyle='#ff0';g.font='16px monospace';g.fillText(n+' '+tt,cx-cw/2+6,cy-ch/2+16)}));},
 st1(W,H,t,o){const c=document.getElementById('c');c.width=W;c.height=H;const g=c.getContext('2d');bg(g,W,H,t);V.sticker(g,o.name,W/2,H/2,o.s||3,Object.assign({t,t0:0},o));}
};
</script></body></html>
