<!doctype html><html><head><meta charset="utf-8"><title>hero test</title>
<style>@font-face{font-family:Rubik;src:url(fonts/Rubik.ttf);font-weight:300 900}html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><span style="font:900 20px Rubik;position:absolute;opacity:0">99% x</span><canvas id="c" width="1080" height="1920"></canvas>
<script src="engine.js"></script><script src="vkit.js"></script><script src="vmascot.js"></script><script src="vhero.js"></script>
<script>
// preset(list) : list of {who,x,y,s,o} drawn on a gradient bg. cols/rows helpers below.
window.PRE = {
 bust: (who, face, view, t) => ({bg:'#2a3f8f', items:[{who,x:540,y:820,s:1.7,o:{bust:true,t:t||1.2,face:face||'happy',view:view||'front',look:'cam'}}]}),
 bust2: (who, face, view, t) => ({bg:'#2a3f8f', items:[{who,x:540,y:1000,s:2.6,o:{bust:true,t:t||1.2,face:face||'happy',view:view||'front',look:'cam'}}]}),
 bustGrid: (who,view) => { const F=V.heroFaces; const it=[]; F.forEach((f,i)=>it.push({who,x:270+(i%2)*540,y:300+Math.floor(i/2)*470,s:.6,o:{bust:true,t:1.2+i*.1,face:f,view:view||'front',look:'cam',mouth:f==='shout'?.8:0}})); return {bg:'#33449a',items:it};},
 poses: (who) => { const P=V.heroPoses; const it=[]; P.forEach((p,i)=>it.push({who,x:190+(i%5)*175,y:560+Math.floor(i/5)*640,s:.5,o:{t:1.3,pose:p,look:'cam',aura:p==='powerup'?1:0}})); return {bg:'#33449a',items:it};},
 posesBig: (who,ps) => { const it=[]; ps.forEach((p,i)=>it.push({who,x:270+(i%2)*540,y:900+Math.floor(i/2)*900,s:1,o:{t:1.3,pose:p,look:'cam',aura:p==='powerup'?1:0}})); return {bg:'#33449a',items:it};},
 views: (who)=>({bg:'#33449a',items:[{who,x:270,y:520,s:.8,o:{bust:true,t:1.2,view:'three',look:'cam',face:'happy'}},{who,x:810,y:520,s:.8,o:{bust:true,t:1.2,view:'side',look:'cam',face:'smug'}},{who,x:270,y:1250,s:.8,o:{bust:true,t:1.2,view:'three',flip:true,face:'wow',look:'cam'}},{who,x:810,y:1250,s:.8,o:{bust:true,t:1.2,view:'front',face:'sparkle',look:'cam'}}]}),
 vill: (ps)=>{const it=[];ps.forEach((p,i)=>it.push({who:'buffering',x:270+(i%2)*540,y:520+Math.floor(i/2)*620,s:.62,o:{t:1.3,pose:p}}));return {bg:'#33449a',items:it};},
 pop: ()=>({bg:'#33449a',items:[0.03,.1,.18,.3,.5].flatMap((tt,i)=>[{who:'kai',x:110+i*215,y:700,s:.34,o:{t:tt+1,t0:1,pose:'cheer'}},{who:'noa',x:110+i*215,y:1100,s:.34,o:{t:tt+1,t0:1,pose:'powerup'}},{who:'buffering',x:110+i*215,y:1500,s:.34,o:{t:tt+1,t0:1,pose:'shout'}}])}),
 tri: ()=>({bg:'#33449a',items:[{who:'kai',x:270,y:900,s:1,o:{t:2.2,view:'three',pose:'point',look:'cam'}},{who:'noa',x:800,y:900,s:1,o:{t:2.2,view:'three',flip:true,pose:'fist',look:'cam'}},{who:'kai',x:270,y:1800,s:1,o:{t:2.2,view:'side',pose:'run',look:'cam'}},{who:'noa',x:800,y:1800,s:1,o:{t:2.2,view:'side',pose:'idle',flip:true,talk:true}}]}),
 all: () => ({bg:'#33449a',items:[{who:'kai',x:280,y:1000,s:1.0,o:{t:1.3,pose:'idle',look:'cam',view:'three'}},{who:'noa',x:800,y:1000,s:1.0,o:{t:1.3,pose:'idle',look:'cam',view:'three',flip:true}},{who:'buffering',x:540,y:1700,s:.9,o:{t:1.3,pose:'shout'}}]}),
};
window.RENDER = (name, args) => { const c=document.getElementById('c'), g=c.getContext('2d'); const sp = PRE[name](...(args||[]));
 g.setTransform(1,0,0,1,0,0); const bg=g.createLinearGradient(0,0,0,1920); bg.addColorStop(0,sp.bg||'#2a3f8f'); bg.addColorStop(1,'#141c50'); g.fillStyle=bg; g.fillRect(0,0,1080,1920);
 sp.items.forEach(i=>V.hero(g,i.who,i.x,i.y,i.s,i.o)); return true; };
</script></body></html>
